name: 🐛 Bug 报告 / Bug Report
description: 报告一个问题 / Report something that is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写以下信息，以便快速定位问题。
        Thanks for reporting! Please fill in the following information so we can reproduce and fix it quickly.
  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Description
      description: 清晰简洁地描述问题 / A clear and concise description of the problem
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: |
        例如：
        1. 在 vite.config.ts 中配置 autoi18nPlugin ...
        2. 运行 `pnpm dev`
        3. 观察 ...
        For example: plugin config, command, what you observed
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为 / Expected behavior
      description: 你期望发生什么 / What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为 / Actual behavior
      description: 实际发生了什么（可贴报错信息）/ What actually happened (error logs are welcome)
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息 / Environment
      description: |
        例如 / For example:
        - OS: Windows 11
        - Node: 22.x
        - 包版本 / package version: auto-i18n-vue@0.0.2
        - 浏览器 / browser: Chrome 126
      value: |
        - OS:
        - Node:
        - auto-i18n-vue 版本 / version:
        - 浏览器（如涉及）/ browser (if applicable):
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional context
      description: 截图、日志或其他背景 / Screenshots, logs or any other context
    validations:
      required: false
