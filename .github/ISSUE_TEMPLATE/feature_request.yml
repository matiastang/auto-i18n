name: ✨ 功能建议 / Feature Request
description: 提出一个新功能或改进建议 / Suggest an idea or improvement for this project
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请描述你想解决的问题与期望的方案。
        Thanks for the suggestion! Please describe the problem you want to solve and your proposed solution.
  - type: textarea
    id: problem
    attributes:
      label: 问题描述 / Problem
      description: 这个功能解决什么问题？（"我希望……但是目前……"）/ What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案 / Proposed solution
      description: 你希望如何实现或表现 / How you expect it to work
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives considered
      description: 你考虑过的其他做法 / Other solutions you have considered
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional context
      description: 截图、示例、参考链接等 / Screenshots, examples, links, etc.
    validations:
      required: false
